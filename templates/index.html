<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Error Detection System</title>
    <style>
        body{
            font-family: Arial;
            background:#e8f5e9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }
        .box{
            background:white;
            width:500px;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }
        h2{ text-align:center; color:green; }
        textarea{
            width:100%;
            height:120px;
            padding:10px;
            font-size:16px;
        }
        button{
            width:100%;
            padding:12px;
            margin-top:10px;
            background:green;
            color:white;
            border:none;
            font-size:16px;
            cursor:pointer;
        }
        #result,#errors{
            background:#f1f8e9;
            padding:10px;
            margin-top:10px;
            border-radius:5px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Grammar Error Detection System</h2>

    <textarea id="text" placeholder="Enter an English sentence..."></textarea>

    <button onclick="checkGrammar()">Check Grammar</button>

    <h3>Corrected Sentence</h3>
    <div id="result"></div>

    <h3>Errors Found</h3>
    <div id="errors"></div>
</div>

<script>
async function checkGrammar(){
    const text=document.getElementById("text").value;

    const response=await fetch("/check",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({text:text})
    });

    const data=await response.json();

    document.getElementById("result").innerText=data.corrected;

    let output="";
    data.errors.forEach(e=>{
        output += "Wrong: "+e.wrong+
                  " → Suggestion: "+e.suggestion.join(", ")+"<br><br>";
    });

    document.getElementById("errors").innerHTML=output;
}
</script>

</body>
</html>
